<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!--
			Fixed at 1×, like an app rather than a page. A chat is not a document to pinch into, and
			the accidental zooms this app was getting were never deliberate ones: a double-tap near
			the composer, or Safari zooming in on a focused input and never zooming back out.
			`interactive-widget=resizes-content` makes the on-screen keyboard shrink the viewport
			instead of sliding the page up under it, which is what keeps the composer where it is.
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<title>Family Group</title>
		<meta name="description" content="Private group chat and location sharing over MQTT." />
		<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/icons/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
